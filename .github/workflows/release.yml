# Release: builds the image and pushes it to GHCR.
#
# Trigger: a `v*` tag whose number equals the pyproject.toml version.
#     uv version --bump patch
#     git commit -am "Version X.Y.Z" && git push origin HEAD
#     git tag -m "Version X.Y.Z" vX.Y.Z && git push origin vX.Y.Z
# The tag must be annotated (-m): `--follow-tags` does not push lightweight tags.
#
# `workflow_dispatch` from a branch publishes `:edge` to test the chain without
# cutting a version. Same pipeline as extia-stats.
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

jobs:
  build-and-push:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      # Enough to push to GHCR with the built-in GITHUB_TOKEN: no secret to manage.
      packages: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Version
        id: version
        run: |
          echo "version=$(python3 -c 'import tomllib;print(tomllib.load(open("pyproject.toml","rb"))["project"]["version"])')" >> "$GITHUB_OUTPUT"
          # The account is "aLepercq", but Docker refuses upper case.
          echo "image=${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Tag must match pyproject.toml
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PROJECT="${{ steps.version.outputs.version }}"
          if [ "$TAG" != "$PROJECT" ]; then
            echo "::error::tag $GITHUB_REF_NAME but pyproject.toml = $PROJECT."
            echo "::error::Run 'uv version --bump <patch|minor|major>' before tagging."
            exit 1
          fi

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # v1.2.3 -> :1.2.3 :1.2 :sha-abc1234 :latest; manual run from a branch -> :edge.
      - name: Image tags and labels
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ steps.version.outputs.image }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short
            type=raw,value=edge,enable=${{ github.ref_type == 'branch' }}
          flavor: |
            latest=${{ startsWith(github.ref, 'refs/tags/v') }}

      - name: Build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          # TrueNAS SCALE is x86-64 only.
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # Otherwise an "unknown/unknown" entry shows up in GHCR.
          provenance: false

      - name: Summary
        run: |
          {
            echo "### Image published"
            echo '```'
            echo "${{ steps.meta.outputs.tags }}"
            echo '```'
            echo "NAS update: TrueNAS -> Apps -> waypoint -> Edit, version number in the \`image:\` line."
          } >> "$GITHUB_STEP_SUMMARY"
