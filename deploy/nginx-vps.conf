# VPS: /etc/nginx/sites-available/waypoint.lepercloud.fr
#
# Relays waypoint.lepercloud.fr to the app on the NAS, over Tailscale.
# HTTP only here: `certbot --nginx -d waypoint.lepercloud.fr` then adds HTTPS
# and the redirect, as for the other subdomains.
server {
    listen 80;
    listen [::]:80;
    server_name waypoint.lepercloud.fr;

    # Read-only app: nothing is ever uploaded.
    client_max_body_size 1k;

    location / {
        proxy_pass http://100.75.61.44:8503;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Short requests only (the app caches upstream calls).
        proxy_connect_timeout 5s;
        proxy_read_timeout    15s;
        proxy_send_timeout    15s;
    }
}
