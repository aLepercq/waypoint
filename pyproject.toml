[project]
name = "waypoint"
version = "0.1.0"
description = "Live departure board for one Naolib bus stop: when to leave home to catch the next bus."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "defusedxml>=0.7",
    "fastapi>=0.115",
    "httpx>=0.28",
    "pydantic-settings>=2.6",
    # zoneinfo data for slim images without system tzdata.
    "tzdata>=2024.1",
    "uvicorn>=0.32",
]

[project.scripts]
waypoint = "waypoint.__main__:main"

[dependency-groups]
dev = [
    "mypy>=1.13",
    "pytest>=8.3",
    "ruff>=0.8",
    "types-defusedxml>=0.7",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/waypoint"]

# --- Quality -------------------------------------------------------------------

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "C4", "RET", "PTH", "N", "PT", "PL", "RUF"]
ignore = [
    "PLR2004",  # magic values: too noisy in tests and domain code
]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
